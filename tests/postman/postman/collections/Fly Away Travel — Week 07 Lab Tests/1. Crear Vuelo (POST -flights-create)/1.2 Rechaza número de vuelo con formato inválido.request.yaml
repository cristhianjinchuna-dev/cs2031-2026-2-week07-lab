$kind: http-request
url: "{{baseUrl}}/flights/create"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "flightNumber": "aa-toolong-984",
      "airline": "Fly Away Travel",
      "departureTime": "2027-06-01T10:00:00",
      "arrivalTime": "2027-06-01T14:00:00",
      "availableSeats": 50
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('[1.2] Número de vuelo inválido (minúsculas/símbolos o >6 chars) responde 400', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 2000
