$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{userEmail}}",
      "password": "WrongPassword999"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('[3.3] Password incorrecto responde 400/401 (no 200 ni 500)', function () {
          pm.expect([400, 401]).to.include(pm.response.code);
      });
    language: text/javascript
order: 3000
