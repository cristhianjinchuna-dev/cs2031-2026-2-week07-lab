$kind: http-request
url: "{{baseUrl}}/users/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "Ana",
      "lastName": "Torres",
      "email": "no-es-un-email",
      "password": "Password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('[2.1] Email con formato inválido responde 400', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 1000
