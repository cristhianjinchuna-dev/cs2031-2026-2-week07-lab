$kind: http-request
url: "{{baseUrl}}/flights/search?airline=Fly"
method: GET
headers:
  Authorization: Bearer {{jwtToken}}
queryParams:
  airline: Fly
scripts:
  - type: afterResponse
    code: |-
      pm.test('[4.3] Búsqueda parcial por aerolínea responde 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
