$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "no-existe.{{uniqueSuffix}}@utec.edu.pe",
      "password": "Password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('[3.2] Email que no existe responde 400/401/404 (no 200 ni 500)', function () {
          pm.expect([400, 401, 404]).to.include(pm.response.code);
      });
    language: text/javascript
order: 2000
