$kind: http-request
name: 1.3 Rechaza hora de salida >= hora de llegada
url: "{{baseUrl}}/flights/create"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "flightNumber": "BB999",
      "airline": "Fly Away Travel",
      "departureTime": "2027-06-01T14:00:00",
      "arrivalTime": "2027-06-01T10:00:00",
      "availableSeats": 50
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('[1.3] Salida posterior o igual a llegada responde 400', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
